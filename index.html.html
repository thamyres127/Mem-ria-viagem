<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memória de Viagem — Jogo da Memória</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="poster">
    <header class="poster__header">
      <svg class="compass" viewBox="0 0 60 60" aria-hidden="true">
        <circle cx="30" cy="30" r="27" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M30 8 L35 30 L30 52 L25 30 Z" fill="currentColor"/>
        <circle cx="30" cy="30" r="3" fill="var(--paper)"/>
      </svg>
      <h1>Memória de Viagem</h1>
      <p class="tagline">Encontre os pares antes que o mapa se feche.</p>
    </header>

    <section class="stats" aria-label="Estatísticas da partida">
      <div class="stat">
        <span class="stat__label">Jogadas</span>
        <span class="stat__value" id="moves">0</span>
      </div>
      <div class="stat">
        <span class="stat__label">Tempo</span>
        <span class="stat__value" id="timer">00:00</span>
      </div>
      <div class="stat">
        <span class="stat__label">Recorde</span>
        <span class="stat__value" id="best">—</span>
      </div>
    </section>

    <main class="board" id="board" role="grid" aria-label="Tabuleiro do jogo"></main>

    <button class="restart" id="restart">Recomeçar viagem</button>

    <footer class="poster__footer">
      <p>Feito com HTML, CSS e JavaScript puro.</p>
    </footer>
  </div>

  <div class="modal" id="winModal" hidden>
    <div class="modal__card">
      <h2>Destino alcançado!</h2>
      <p id="winSummary"></p>
      <button class="restart" id="playAgain">Jogar novamente</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
